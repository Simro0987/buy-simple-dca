# nginx config for the static SPA (used by the Docker image on Flux).
# Listens on 8080 as an unprivileged user, on all interfaces (0.0.0.0 + [::]).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # NOTE: nginx does not inherit add_header into locations that define their own,
    # so every location includes the shared security headers explicitly.
    include /etc/nginx/snippets/security-headers.conf;

    # Optional agent-runner status proxy, generated at start (see 40-runtime-config.sh).
    include /tmp/runtime/nginx-*.conf;

    # Liveness endpoint for Flux / Docker health checks.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime config generated at container start from env vars (see docker-entrypoint.d/40-runtime-config.sh).
    location = /env-config.js {
        alias /tmp/runtime/env-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Safe{Wallet} fetches the Safe App manifest cross-origin -> needs CORS.
    location = /manifest.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "X-Requested-With, content-type, Authorization" always;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback (react-router).
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
